<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign In — Voxel Meadow</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #2a2f3a;
    --text: #f2f4f8;
    --muted: #9aa4b2;
    --accent: #4f8cff;
    --danger: #ff6b6b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: radial-gradient(900px 500px at 50% -10%, #1c2434, var(--bg));
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 32px 28px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  }

  h1 {
    margin: 0;
    text-align: center;
    font-size: 28px;
    letter-spacing: -0.02em;
  }

  .sub {
    margin: 6px 0 0;
    text-align: center;
    font-size: 14px;
    color: var(--muted);
  }

  form { margin-top: 24px; display: flex; flex-direction: column; gap: 16px; }

  label { display: flex; flex-direction: column; gap: 6px; }

  .lab {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }

  input, textarea {
    width: 100%;
    font: inherit;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    outline: none;
  }

  textarea { resize: none; min-height: 74px; }

  input::placeholder, textarea::placeholder { color: #5b6472; }

  input:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79, 140, 255, 0.25);
  }

  .error {
    margin: 0;
    font-size: 13px;
    color: var(--danger);
    min-height: 18px;
  }

  button {
    margin-top: 4px;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 10px;
    padding: 12px 16px;
    cursor: pointer;
    transition: transform 0.12s ease, filter 0.12s ease;
  }

  button:hover { filter: brightness(1.08); transform: scale(1.02); }
  button:active { transform: scale(0.98); }
</style>
</head>
<body>
  <main class="card">
    <h1>Voxel Meadow</h1>
    <p class="sub">Sign in to start playing</p>

    <form id="signin" novalidate>
      <label>
        <span class="lab">Username</span>
        <input id="username" name="username" type="text" maxlength="24"
               placeholder="coolplayer42" autocomplete="username" />
      </label>

      <label>
        <span class="lab">Password</span>
        <input id="password" name="password" type="password" maxlength="64"
               placeholder="••••••••" autocomplete="new-password" />
      </label>

      <label>
        <span class="lab">Bio</span>
        <textarea id="bio" name="bio" maxlength="140" rows="3"
                  placeholder="Tell us about yourself..."></textarea>
      </label>

      <p class="error" id="error" role="alert"></p>

      <button type="submit">Sign In &amp; Play</button>
    </form>
  </main>

  <script>
    // ---- Change this to your game's address ------------------------------
    const GAME_URL = "https://voxel-meadow-server.onrender.com";
    // ---------------------------------------------------------------------

    const form = document.getElementById("signin");
    const errBox = document.getElementById("error");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const bio = document.getElementById("bio").value.trim();

      if (!username || !password || !bio) {
        errBox.textContent = "Please fill in all three fields.";
        return;
      }

      // Saved so your game can read who is playing.
      localStorage.setItem("player", JSON.stringify({ username: username, bio: bio }));

      // Also passed in the address, so the game still knows who you are
      // even when it lives on a different web address.
      const target = GAME_URL + (GAME_URL.indexOf("?") > -1 ? "&" : "?") +
        "player=" + encodeURIComponent(username);
      window.location.href = target;
    });

    // Reading it back inside the game:
    //   const player = JSON.parse(localStorage.getItem("player") || "null");
    //   const name = new URLSearchParams(location.search).get("player");
  </script>
</body>
</html>
